version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build: ./services/auth
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/photo_prestige
      - JWT_SECRET=supersecretkey
    depends_on:
      - mongo
      - rabbitmq

  register-service:
    build: ./services/register
    container_name: register-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - MONGO_URI=mongodb://mongo:27017/photo_prestige
      - PORT=3002
    depends_on:
      - mongo
      - rabbitmq

  mail-service:
    build: ./services/mail
    container_name: mail-service
    restart: always
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - rabbitmq

  target-service:
    build: ./services/target
    container_name: target-service
    restart: always
    ports:
      - "3003:3003"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongo:27017/photo_prestige
      - PORT=3003
    depends_on:
      - mongo
      - rabbitmq

  score-service:
    build: ./services/score
    container_name: score-service
    restart: always
    ports:
      - "3004:3004"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongo:27017/photo_prestige
      - PORT=3004
      - IMAGGA_API_KEY=acc_054ec93b191b33b
      - IMAGGA_API_SECRET=08f84ef970336c20cab4ccf98517a9db
    depends_on:
      - mongo
      - rabbitmq


volumes:
  mongo_data:
